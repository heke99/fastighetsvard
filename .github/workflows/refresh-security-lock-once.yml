name: Refresh security lock once

on:
  push:
    branches:
      - codex/system-consistency-audit-2026-08-06

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/system-consistency-audit-2026-08-06
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Refresh vulnerable production dependencies
        run: npm audit fix --force --package-lock-only
      - name: Verify deterministic install
        run: npm ci
      - name: Reject high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Remove one-time workflow and commit lock refresh
        shell: bash
        run: |
          rm .github/workflows/refresh-security-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/refresh-security-lock-once.yml
          if git diff --cached --quiet; then
            echo "No dependency changes were generated."
            exit 1
          fi
          git commit -m "fix: refresh vulnerable production dependencies"
          git push origin HEAD:codex/system-consistency-audit-2026-08-06
